[package]
name = "sysdoctor"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
nix = { version = "0.32.0", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
trash = "5.4.0"

[dev-dependencies]
tempfile = "3.27.0"
