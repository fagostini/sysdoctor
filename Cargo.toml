[package]
name = "sysdoctor"
version = "0.1.0"
edition = "2024"
description = "Linux health check and cleanup advisor"
license = "MIT"
readme = "README.md"
authors = ["Federico Agostini"]

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
clap_complete = "4.6.12"
clap_mangen = "0.3.4"
gtk4 = { version = "0.9", optional = true, features = ["v4_12"] }
vte4 = { version = "0.8", optional = true }
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
nix = { version = "0.32.0", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
trash = "5.4.0"

[features]
gui = ["dep:gtk4", "dep:vte4"]

[dev-dependencies]
tempfile = "3.27.0"

[package.metadata.deb]
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "smartmontools, libnotify-bin"
extended-description = """\
One command answers "is anything wrong with this machine?" (failed services, \
disk space, SMART, pending security updates, backups, battery, key expiry, \
secrets in shell history) and "what can I safely delete?" (stale build output, \
caches, old kernels, journal). Optional hourly timer notifies only on new problems."""
# Generated by scripts/deb.sh before packaging.
assets = [
    ["target/release/sysdoctor", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/sysdoctor/", "644"],
    ["target/assets/sysdoctor.1", "usr/share/man/man1/", "644"],
    ["target/assets/sysdoctor.bash", "usr/share/bash-completion/completions/sysdoctor", "644"],
    ["target/assets/_sysdoctor", "usr/share/zsh/vendor-completions/", "644"],
    ["target/assets/sysdoctor.fish", "usr/share/fish/vendor_completions.d/", "644"],
]
